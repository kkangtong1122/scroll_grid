<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>포토 앨범 꾸미기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: PC는 왼쪽 고르기·입력 / 오른쪽 미리보기(화면에 고정). 좁은 화면은 위아래로 쌓기.
   버튼은 두 가지뿐: 고르는 것 = 동그란 칩, 하는 것 = 네모 버튼. */
:root {
  --bg: #efebe6;
  --panel: #fbf9f6;
  --ink: #3b2f2a;
  --muted: #7b6d64;
  --line: #ddd4cb;
  --accent: #7a5546;
  --accent-ink: #fffaf5;
  --stage: #e4ded7;
  --danger: #b4442c;
  --font-display: "Gowun Batang", "Nanum Myeongjo", serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono: ui-monospace, Consolas, "D2Coding", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d1916; --panel: #27221e; --ink: #efe6de; --muted: #a8998e; --line: #3b332d;
    --accent: #d2a58f; --accent-ink: #231c18; --stage: #15120f; --danger: #e07a62; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1d1916; --panel: #27221e; --ink: #efe6de; --muted: #a8998e; --line: #3b332d;
  --accent: #d2a58f; --accent-ink: #231c18; --stage: #15120f; --danger: #e07a62; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: 15px; line-height: 1.6;
}
.wrap {
  max-width: 1440px; margin: 0 auto;
  padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 18px;
}
header { display: grid; gap: 2px; }
h1 { margin: 0; font-family: var(--font-display); font-size: 1.75rem; line-height: 1.3; text-wrap: balance; }
header p { margin: 0; color: var(--muted); font-size: .92rem; }

.app { display: grid; gap: 18px; align-items: start; }
.side { display: grid; gap: 14px; min-width: 0; }
.main { display: grid; gap: 10px; min-width: 0; }
@media (min-width: 1040px) {
  .app { grid-template-columns: minmax(360px, 420px) minmax(0, 1fr); gap: 22px; }
  .main { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
  .stage { max-height: calc(100vh - 150px); overflow: auto; }
}

.panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 16px 18px; display: grid; gap: 14px;
}
.group { display: grid; gap: 7px; min-width: 0; }
.label { font-size: .78rem; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
.ptitle { margin: 0; font-size: .98rem; display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
.hint { font-size: .8rem; color: var(--muted); font-weight: 400; margin: 0; }
.hint code { font-family: var(--font-mono); font-size: .78rem; background: var(--line); padding: 0 4px; border-radius: 4px; color: var(--ink); }

/* 고르는 것: 칩 */
.chips { display: flex; flex-wrap: wrap; gap: 7px; min-width: 0; }
.chip, .opt {
  appearance: none; border: 1px solid var(--line); background: transparent; color: var(--ink);
  font: inherit; font-size: .87rem; padding: 5px 12px; border-radius: 999px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; transition: background .15s, border-color .15s, color .15s;
}
.chip:hover:not(:disabled), .opt:hover:not(:disabled) { border-color: var(--accent); }
.chip[aria-pressed="true"], .opt[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt::before { content: "✓"; width: .8em; text-align: center; font-size: .78rem; font-weight: 700; opacity: .25; }
.opt[aria-pressed="true"]::before { opacity: 1; }
.chip:disabled, .opt:disabled { opacity: .4; cursor: not-allowed; }
.dot { width: 12px; height: 12px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px #0000001f; }

/* 하는 것: 네모 버튼 */
.btn, .copy {
  appearance: none; font: inherit; font-size: .87rem; font-weight: 700; padding: 7px 14px; border-radius: 9px;
  cursor: pointer; white-space: nowrap; border: 1px solid var(--accent);
}
.btn { background: transparent; color: var(--accent); }
.btn:hover { background: var(--accent); color: var(--accent-ink); }
.copy { background: var(--accent); color: var(--accent-ink); min-width: 104px; }
.copy:hover { filter: brightness(1.08); }
.chip:focus-visible, .opt:focus-visible, .btn:focus-visible, .copy:focus-visible, .linkbtn:focus-visible, summary:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}

/* 입력 */
.field { display: grid; gap: 5px; min-width: 0; }
.field > label, .flabel { font-size: .78rem; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
#f-text { display: grid; gap: 10px; }
input[type="text"], .field textarea {
  width: 100%; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); color: var(--ink);
  font: inherit; font-size: .9rem; padding: 7px 11px; min-width: 0;
}
.field textarea { resize: vertical; line-height: 1.5; }
input[type="text"]::placeholder, .field textarea::placeholder { color: var(--muted); opacity: .75; }
input[type="text"]:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.addrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: stretch; }
.addbtns { display: grid; gap: 6px; align-content: start; }
.plist { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.plist li { border: 1px solid var(--line); border-radius: 10px; padding: 5px; display: grid; gap: 4px; background: var(--bg); min-width: 0; }
.plist .thumb { aspect-ratio: 4 / 3; max-width: 100%; border-radius: 6px; background: var(--line); display: grid; place-items: center; font-size: .72rem; color: var(--muted); overflow: hidden; }
.plist .meta { display: flex; gap: 5px; align-items: center; min-width: 0; font-size: .74rem; }
.plist .n { font-family: var(--font-mono); font-weight: 700; }
.plist .tag { font-size: .68rem; padding: 0 6px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); flex: none; }
.plist .tag.file { border-color: var(--accent); color: var(--accent); }
.plist .src { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); min-width: 0; }
.plist .acts { display: flex; gap: 3px; }
.plist .acts button {
  flex: 1; appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 6px; font: inherit; font-size: .74rem; padding: 1px 0; cursor: pointer;
}
.plist .acts button:hover:not(:disabled) { border-color: var(--accent); }
.plist .acts button:disabled { opacity: .35; cursor: default; }
.caps { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.caps li { display: grid; grid-template-columns: 22px minmax(0, 1fr) 30px; align-items: center; gap: 6px; }
.caps .n { font-family: var(--font-mono); font-size: .78rem; color: var(--muted); text-align: right; }
.caps .del { appearance: none; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 7px; height: 32px; font: inherit; font-size: .78rem; cursor: pointer; }
.caps .del:hover { border-color: var(--danger); color: var(--danger); }
.caps .del:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.warn { color: var(--danger); font-size: .8rem; margin: 0; }
.cap-actions { display: flex; justify-content: flex-start; }
.panel-actions { display: flex; justify-content: flex-end; }
.linkbtn { appearance: none; border: 0; background: none; color: var(--muted); font: inherit; font-size: .8rem; text-decoration: underline; cursor: pointer; padding: 0; }

/* 미리보기 */
.bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.bar .title { font-weight: 700; font-size: .98rem; }
.bar .file { font-family: var(--font-mono); font-size: .76rem; color: var(--muted); margin-left: 6px; font-weight: 400; }
.bar .slots { flex: 1 1 200px; min-width: 0; }
.viewer { background: var(--stage); border-radius: 14px; padding: 12px; display: grid; gap: 10px; min-width: 0; }
.viewer .bar { padding: 2px 4px 0 6px; }
.stage {
  display: flex; justify-content: center; border-radius: 8px;
  scrollbar-width: none; -ms-overflow-style: none;
}
.stage::-webkit-scrollbar { display: none; }
.stage iframe { display: block; width: 100%; max-width: 100%; height: 600px; border: 0; background: #fff; border-radius: 6px; }

details.code { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
details.code summary { cursor: pointer; padding: 8px 14px; font-size: .85rem; color: var(--muted); list-style: none; display: flex; align-items: center; gap: 6px; }
details.code summary::-webkit-details-marker { display: none; }
details.code summary::before { content: "▸"; font-size: .75rem; transition: transform .15s; }
details.code[open] summary::before { transform: rotate(90deg); }
#out {
  display: block; width: 100%; height: 280px; resize: vertical; border: 0; border-top: 1px solid var(--line);
  border-radius: 0 0 10px 10px; background: transparent; color: var(--ink); font-family: var(--font-mono);
  font-size: .78rem; line-height: 1.55; padding: 12px 14px; white-space: pre; overflow: auto; tab-size: 4;
}

@media (max-width: 600px) {
  .viewer { padding: 8px; }
  .bar .slots { order: 3; flex-basis: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>


<div class="wrap">
  <header>
    <h1>포토 앨범 꾸미기</h1>
    <p>테마와 옵션을 고르고 내용을 넣은 뒤, 코드를 복사해 블로그 HTML 편집기에 붙여넣으세요.</p>
  </header>

  <div class="app">
    <div class="side">
      <section class="panel" aria-label="고르기">
        <div class="group">
          <span class="label" id="lbl-theme">테마</span>
          <div class="chips" id="themes" role="group" aria-labelledby="lbl-theme"></div>
        </div>
        <div class="group">
          <span class="label" id="lbl-layout">구성</span>
          <div class="chips" id="layouts" role="group" aria-labelledby="lbl-layout"></div>
        </div>
        <div class="group">
          <span class="label" id="lbl-opts">옵션</span>
          <div class="chips" role="group" aria-labelledby="lbl-opts">
            <button class="opt" id="pol" aria-pressed="true" type="button">폴라로이드</button>
            <button class="opt" id="text" aria-pressed="false" type="button">사진별 글씨</button>
            <button class="opt" id="emoji" aria-pressed="true" type="button">이모지</button>
            <button class="opt" id="tape" aria-pressed="false" type="button">마스킹테이프</button>
            <button class="opt" id="anim" aria-pressed="true" type="button" hidden>배경 애니메이션</button>
          </div>
        </div>
      </section>

      <section class="panel" aria-label="내용 넣기">
        <h2 class="ptitle">내용 넣기 <span class="hint">비워둔 칸은 미리보기에만 흐리게 보여요</span></h2>
        <div id="f-text">
          <div class="field" id="f-title"><label for="in-title">제목</label><input type="text" id="in-title" autocomplete="off"></div>
          <div class="field" id="f-sub"><label for="in-sub">소제목</label><input type="text" id="in-sub" autocomplete="off"></div>
          <div class="field" id="f-footer"><label for="in-footer">날짜 · 서명</label><input type="text" id="in-footer" autocomplete="off"></div>
        </div>
        <div class="field" id="f-photos">
          <span class="flabel">사진</span>
          <div class="addrow">
            <textarea id="in-links" rows="2" placeholder="사진 주소 (여러 장은 한 줄에 하나씩)"></textarea>
            <div class="addbtns">
              <button class="btn" id="add-links" type="button">링크 추가</button>
              <button class="btn" id="add-files" type="button">파일 추가</button>
              <input type="file" id="in-files" accept="image/*" multiple hidden>
            </div>
          </div>
          <p class="hint">파일 사진은 미리보기에만 보이고, 코드에는 <code>이미지링크N</code> 자리로 들어가요.</p>
          <ol class="plist" id="plist"></ol>
          <p class="hint" id="plist-empty">아직 사진이 없어 예시 사진으로 보여요.</p>
        </div>
        <div class="field" id="f-caps">
          <span class="flabel">사진별 글씨</span>
          <p class="warn" id="caps-warn" hidden></p>
          <ol class="caps" id="caps"></ol>
          <div class="cap-actions"><button class="btn" id="add-card" type="button" title="카드를 빼면 그 자리의 사진도 함께 빠져요">+ 카드 추가</button></div>
        </div>
        <div class="panel-actions"><button class="linkbtn" id="reset" type="button">입력한 내용 모두 지우기</button></div>
      </section>
    </div>

    <div class="main">
      <div class="viewer">
        <div class="bar">
          <span class="title">미리보기<span class="file" id="filename"></span></span>
          <span class="hint slots" id="slots"></span>
          <button class="copy" id="copy" type="button">코드 복사</button>
        </div>
        <div class="stage" id="stage">
          <iframe id="preview" title="앨범 미리보기"></iframe>
        </div>
      </div>
      <details class="code">
        <summary>코드 보기</summary>
        <textarea id="out" readonly spellcheck="false" aria-label="복사할 코드"></textarea>
      </details>
    </div>
  </div>
</div>

        };
        acts.appendChild(b);
      });
      li.appendChild(th); li.appendChild(meta); li.appendChild(acts);
      plistEl.appendChild(li);
    });
  }
  function defaultCount() { var inf = info(T[state.theme][state.layout]); return inf.caps ? inf.caps.length : inf.photoCount; }
  // 예시 상태에서 카드를 처음 고칠 때, 지금 보이는 예시 카드 수만큼 빈 자리를 만들어 둡니다.
  function customize() {
    if (userPhotos.length) return;
    var inf = info(T[state.theme][state.layout]), n = defaultCount();
    for (var i = 0; i < n; i++) {
      userPhotos.push({ type: 'slot' });
      if (inf.caps && !(content.caps[i] || '').trim()) content.caps[i] = inf.caps[i] || '';
    }
  }
  function removeCard(i) {
    var gone = userPhotos.splice(i, 1)[0];
    if (gone && gone.type === 'file') { try { URL.revokeObjectURL(gone.src); } catch (e) {} }
    content.caps.splice(i, 1);
    if (!userPhotos.length) content.caps = [];
    lastCapsKey = ''; photosChanged();
  }
  function photosChanged() { saveText(); renderPhotos(); syncFields(); updateOutput(); }

  function syncHide() {
    [].forEach.call(document.querySelectorAll('.hide'), function (b) {
      var on = !!(content.hide && content.hide[b.dataset.k]);
      b.setAttribute('aria-pressed', on);
      b.textContent = on ? '숨김' : '숨기기';
      inputs[b.dataset.k].disabled = on;
    });
  }
  [].forEach.call(document.querySelectorAll('.hide'), function (b) {
    b.onclick = function () {
      content.hide = content.hide || {};
      content.hide[b.dataset.k] = !content.hide[b.dataset.k];
      syncHide(); saveText(); updateOutput();
    };
  });
  Object.keys(inputs).forEach(function (k) {
    inputs[k].addEventListener('input', function (e) { content[k] = e.target.value; saveText(); schedule(); });
  });
  $('add-links').onclick = function () {
    var lines = $('in-links').value.split(/\s*\n\s*/).map(function (x) { return x.trim(); }).filter(Boolean);
    var bad = 0;
    lines.forEach(function (u) {
      var m = u.match(/src="([^"]+)"/); if (m) u = m[1];
      if (/^(https?:)?\/\//i.test(u)) userPhotos.push({ type: 'url', src: u, name: u }); else bad++;
    });
    $('in-links').value = bad ? lines.filter(function (u) { return !/^(https?:)?\/\//i.test(u) && !/src="/.test(u); }).join('\n') : '';
    $('in-links').setCustomValidity('');
    if (bad) $('in-links').placeholder = 'http로 시작하는 주소만 넣을 수 있어요.';
    photosChanged();
  };
  $('add-files').onclick = function () { $('in-files').click(); };
  $('add-card').onclick = function () {
    customize(); userPhotos.push({ type: 'slot' }); lastCapsKey = ''; photosChanged();
    var last = capsEl.querySelector('li:last-child input'); if (last) last.focus();
  };
  $('in-files').addEventListener('change', function (e) {
    [].forEach.call(e.target.files, function (f) {
      if (!/^image\//.test(f.type)) return;
      userPhotos.push({ type: 'file', src: URL.createObjectURL(f), name: f.name });
    });
    e.target.value = '';
    photosChanged();
  });
  $('reset').onclick = function () {
    content = { title: '', sub: '', footer: '', caps: [], hide: {} };
    userPhotos.forEach(function (p) { if (p.type === 'file') { try { URL.revokeObjectURL(p.src); } catch (e) {} } });
    userPhotos = [];
    Object.keys(inputs).forEach(function (k) { inputs[k].value = ''; });
    syncHide();
    $('in-links').value = '';
    lastCapsKey = ''; photosChanged();
  };
  try {
    var saved = JSON.parse(localStorage.getItem('album-content') || 'null');
    if (saved && typeof saved === 'object') {
      ['title', 'sub', 'footer'].forEach(function (k) { if (typeof saved[k] === 'string') { content[k] = saved[k]; inputs[k].value = saved[k]; } });
      if (saved.hide && typeof saved.hide === 'object') ['title', 'sub', 'footer'].forEach(function (k) { content.hide[k] = saved.hide[k] === true; });
      if (Array.isArray(saved.caps)) content.caps = saved.caps.map(function (x) { return typeof x === 'string' ? x : ''; });
    }
  } catch (e) {}
  syncHide();
  renderPhotos();

  emojiBtn.onclick = function () { set({ emoji: !state.emoji }); };
  tapeBtn.onclick = function () { set({ tape: !state.tape }); };
  document.getElementById('anim').onclick = function () { set({ anim: !state.anim }); };
  // 글씨는 폴라로이드 흰 여백에 들어가므로, 글씨를 켜면 폴라로이드도 켜집니다.
  polBtn.onclick = function () { set(state.pol ? { pol: false, text: false } : { pol: true }); };
  textBtn.onclick = function () { set(state.text ? { text: false } : { text: true, pol: true }); };
  window.addEventListener('resize', function () { setTimeout(fit, 100); });

  copyBtn.onclick = function () {
    var text = out.value;
    function done(msg) { copyBtn.textContent = msg; setTimeout(function () { copyBtn.textContent = '코드 복사'; }, 1600); }
    function fallback() {
      out.closest('details').open = true;
      out.focus(); out.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      done(ok ? '복사했어요' : 'Ctrl+C로 복사');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done('복사했어요'); }, fallback);
    } else fallback();
  };

  function fromHash() {
    var m = location.hash.slice(1).match(/^([a-z]+)-(0[1-57])$/);
    if (m && T[m[1]] && T[m[1]][m[2]]) { state.theme = m[1]; fromLayout(m[2]); return true; }
    return false;
  }
  try { var o = JSON.parse(localStorage.getItem('album-opts') || '{}'); if (typeof o.emoji === 'boolean') state.emoji = o.emoji; if (typeof o.tape === 'boolean') state.tape = o.tape; if (typeof o.anim === 'boolean') state.anim = o.anim; } catch (e) {}
  fromHash();
  window.addEventListener('hashchange', function () { if (fromHash()) render(); });
  render();
})();
</script>

</body>
</html>
